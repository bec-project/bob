name: Publish agent image

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      GITEA_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialize version publication and latest promotion, including retries of old runs.
    concurrency:
      group: bob-image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Gitea registry
        env:
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
        run: |
          printf '%s' "${GITEA_REGISTRY_TOKEN#*:}" | docker login gitea.psi.ch \
            --username "${GITEA_REGISTRY_TOKEN%%:*}" --password-stdin
      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@v7
        with:
          context: ./containers
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gitea.psi.ch/bec/bob:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Promote the newest stable release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash ci/promote_image.sh "$RELEASE_VERSION"
