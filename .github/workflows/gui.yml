name: GUI checks

on: [workflow_call]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Check Rust formatting
        run: cargo fmt --check
