name: Continuous Delivery

on:
  workflow_call:
    secrets:
      GITEA_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_available: ${{ steps.delivery.outputs.release_available }}
      version: ${{ steps.delivery.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked release tooling
        run: npm ci --ignore-scripts
      - name: Recover interrupted GitHub publication for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/recover_release.sh
      - name: Semantic release and publish binary archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
      - name: Deliver release binaries to Gitea (including retries)
        id: delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
        run: bash ci/publish_release.sh

  qt-desktop:
    needs: release
    if: needs.release.outputs.release_available == 'true'
    uses: ./.github/workflows/qt_desktop.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.version }}

  qt-desktop-publish:
    needs: [release, qt-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: qt-desktop-*
          merge-multiple: true
          path: dist
      - name: Deliver the Qt desktop app to Gitea (generic and RPM registry) and the GitHub release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
        run: bash ci/publish_qt_desktop.sh "$VERSION" dist
