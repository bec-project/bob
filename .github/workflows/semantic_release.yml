name: Continuous Delivery

on:
  workflow_call:
    secrets:
      GITEA_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_made: ${{ steps.release.outputs.release_made }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked release tooling
        run: npm ci --ignore-scripts
      - name: Semantic release and publish binary archives
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'release_made=false' >> "$GITHUB_OUTPUT"
          npx --no-install semantic-release
      - name: Publish Go binaries to Gitea
        if: steps.release.outputs.release_made == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
        run: |
          for package in dist/*.tar.gz dist/SHA256SUMS; do
            curl --fail-with-body \
              --user "$GITEA_REGISTRY_TOKEN" \
              --upload-file "$package" \
              "https://gitea.psi.ch/api/packages/bec/generic/bob/${RELEASE_VERSION}/$(basename "$package")"
          done

  container:
    needs: release
    if: needs.release.outputs.release_made == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/container_build.yml
    secrets:
      GITEA_REGISTRY_TOKEN: ${{ secrets.GITEA_REGISTRY_TOKEN }}
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.version }}
