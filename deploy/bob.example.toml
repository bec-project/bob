[sandbox]
# bob runs OpenCode on this machine under Anthropic's sandbox-runtime (Linux, needs bwrap and
# socat): little of the host readable, the workspace mounts below and its own home, and no
# network but the provider and MCP hosts in this file, through sandbox-runtime's proxies.
# sandbox-runtime's dist/cli.js. Default: the copy installed with bob-manager
# (../lib/sandbox-runtime beside it, as the RPM has it).
# runtime = "/path/to/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js"
# The OpenCode executable; a bare name is looked up on PATH. Default: the OpenCode installed with
# bob-manager (../libexec/opencode beside it, as the RPM has it), else "opencode" on PATH.
# opencode = "/opt/opencode/opencode"
# The folder that keeps OpenCode's home, configuration and sessions, one per user.
# Default: "$XDG_DATA_HOME/bob/home". Keep it off NFS: sessions live in SQLite.
# home = "/var/tmp/bob-home"
# Address the GUI reaches OpenCode on. Default: "0.0.0.0" (reachable from other hosts).
# Use "127.0.0.1" for host-only access. The API still requires its generated password.
bind_address = "0.0.0.0"

# Optional: folders of this machine the sandbox sees. OpenCode may use only the MCP servers'
# tools, so bob needs none; without [workspace] it works in its own home.
# [workspace]
# Working directory, mounted writable at the same absolute path inside the sandbox.
# OpenCode starts here, independently of the additional mounts.
# workdir = "."
# Additional writable directories. Default: [].
# Example: rw = ["../output"].
# rw = []
# Additional read-only directories. Default: [].
# Example: ro = ["../notes", "/absolute/path/to/data"].
# ro = []
# Relative paths resolve beside this file; "." means this config's directory.
# Host and sandbox paths are identical. Read-only directories must not
# overlap workdir or any RW directory, including through symlinks.

[provider]
# Model provider's API URL, including its API path. Required, with no default.
# The sandbox reaches this host and port only, through bob-manager; URL path restrictions must
# be enforced by the server.
# Replace this placeholder with your provider or gateway URL.
base_url = "https://ai-provider.example.com/api/"
# Model ID offered by the provider. Default: "Qwen3.8-27B".
model = "Qwen3.8-27B"
# Optional provider/gateway token. Overrides API_KEY, including an explicit empty token.
# token = "your-user-token"
# Optional model context window in tokens, passed to OpenCode as the model's limit.
# OpenCode uses it to show how full the context is and to compact a session before it overflows.
# PSI's gateway reports max_model_len 262144 for Qwen3.8-27B.
# Default: 0 (unset; OpenCode receives no limit).
# context_limit = 262144
# Optional maximum output in tokens. Requires context_limit and must be smaller than it.
# Default: 0, which uses min(32768, context_limit / 4) when context_limit is set.
# output_limit = 32768

# Name each MCP through its table key; add more tables for additional servers.
# The name is used unchanged in OpenCode's mcp configuration.
# [mcp.bec_mcp]
# Required HTTP(S) MCP endpoint. The sandbox reaches this host and port only, through bob-manager.
# host.containers.internal stands for this machine, so a server listening on 127.0.0.1 works.
# url = "http://mcp.example:8000/mcp"
# Optional GUI plugin that adds views for this server's tools, such as "bec". Each server names
# at most one; the GUI makes one instance of it per server, which users can switch off there.
# plugin = "bec"

# To let bob start a host HTTP MCP server, keep url and add host_command below.
# host_command executes OUTSIDE the sandbox, without shell parsing.
# It must stay in the foreground. Bob waits for its TCP port and stops its process group on exit.
# The URL must use host.containers.internal, which bob-manager reaches on 127.0.0.1.
# The command inherits bob's launch directory; use an installed server executable.
# host_command = ["/path/to/bec-mcp-server", "--transport", "streamable-http", "--port", "19000", "--allow-unauthenticated", "--allowed-hosts", "host.containers.internal:19000"]
# Host MCP dependencies and service access belong on the host, not in the sandbox.
# This does not give the agent direct access to Redis.
