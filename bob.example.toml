[container]
# Run OpenCode's browser UI with "web" instead of the default headless "serve".
# The published port serves both the UI and API. Default: false.
web = true
# Container engine: "docker" or "podman". Default: "podman".
runtime = "docker"
# Image tag to launch; build this image from ./container first.
# Default: "localhost/bob".
image = "localhost/bob"
# Named volume that preserves OpenCode's home, configuration, and sessions.
# Default: "bob-cli-home". Shared across launches using the same volume name.
home_volume = "bob-cli-home"
# Optional container name. Omit to generate a unique name for each launch.
# name = "bob"
# OpenCode API bind address. Default: "0.0.0.0" (reachable from other hosts).
# Use "127.0.0.1" for host-only access. The API still requires its generated password.
bind_address = "0.0.0.0"

[workspace]
# Required working directory, mounted writable at the same absolute path inside
# the container. OpenCode starts here, independently of the additional mounts.
workdir = "."
# Additional writable directories. Default: [].
# Example: rw = ["../output"].
rw = []
# Additional read-only directories. Default: [].
# Example: ro = ["../notes", "/absolute/path/to/data"].
ro = []
# Relative paths resolve beside this file; "." means this config's directory.
# Host and container mount paths are identical. Read-only directories must not
# overlap workdir or any RW directory, including through symlinks.

[provider]
# Model provider's API URL, including its API path. Must be reachable from the container.
# Required, with no default. The firewall allows this server's IPs and TCP port.
# URL path restrictions must be enforced by the server.
# Replace this placeholder with your provider or gateway URL.
base_url = "https://ai-provider.example.com/api/"
# Model ID offered by the provider. Default: "Qwen3.8-27B".
model = "Qwen3.8-27B"
# Optional provider/gateway token. Overrides API_KEY, including an explicit empty token.
# token = "your-user-token"

[mcp]
# Optional remote HTTP MCP endpoint. Its server IPs and TCP port are added to the outbound allowlist.
# Choose either url or command. Remote connections do not need published ports.
# url = "http://mcp.example:8000/mcp"
# Optional stdio MCP launch command: executable followed by arguments, without a shell.
# Runs inside the container in workspace.workdir; OpenCode manages its lifecycle.
# The executable must be installed in the image or available through a mount.
# command = ["python3", "/absolute/path/to/mcp_server.py"]
# Optional single container port for an incoming MCP server. Omit or use 0 to disable.
# Use a port from 1024 to 65535, excluding OpenCode's reserved port 4096.
# A host port is allocated automatically on loopback. This does not start an MCP server.
# port = 19000
