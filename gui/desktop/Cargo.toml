[package]
name = "bob-gui"
version = "0.1.0"
description = "Desktop shell for bob's chat GUI"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "bob_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
libc = "0.2"

[profile.release]
strip = true
